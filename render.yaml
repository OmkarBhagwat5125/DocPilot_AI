services:
  - type: web
    name: docpilot-ai-backend
    runtime: python
    plan: free
    branch: main
    autoDeployTrigger: commit
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT --workers 1
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: QDRANT_COLLECTION
        value: docpilot_docs
      - key: CORS_ORIGINS
        value: https://doc-pilot-ai-lake.vercel.app
      - key: UPLOAD_DIR
        value: uploads
      - key: EMBEDDING_BATCH_SIZE
        value: "4"
      - key: EMBEDDING_THREADS
        value: "1"
      - key: MAX_UPLOAD_MB
        value: "10"
      - key: TOKENIZERS_PARALLELISM
        value: "false"
      - key: OMP_NUM_THREADS
        value: "1"
